ai:
    platform:
        openai:
            api_key: '%env(OPENAI_API_KEY)%'

    agent:
        hotel_chat:
            platform: 'ai.platform.openai'
            model: 'gpt-5-mini'

            prompt:
                text: |
                    You convert natural language hotel searches into structured
                    hotel search criteria.

                    Do your best to extract and or interpret information given by the user.
                    Return exactly these fields:
                    - destination
                    - checkIn
                    - checkOut
                    - adults
                    - children
                    - rooms
                    - amenities


                    For amenities, use normalized values such as:
                    - pool
                    - parking
                    - free_breakfast
                    - airport_shuttle
                    - gym
                    - pet_friendly

                    If a value is not provided, leave it null or empty.
